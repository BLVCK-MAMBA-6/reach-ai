<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Reach AI progress</title>
  <description id="description">An animated journey through Discover, Verify, Connect and Act.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="28" fill="url(#background)"/>
  <path d="M170 155 H430 H690 H950" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="170" cy="155" r="22" fill="#38bdf8" filter="url(#glow)"><animate attributeName="r" values="22;29;22" dur="4s" begin="0s" repeatCount="indefinite"/></circle>
    <text x="170" y="105" fill="#e0f2fe" font-size="28" font-weight="700">Discover</text>
    <circle cx="430" cy="155" r="22" fill="#a78bfa" filter="url(#glow)"><animate attributeName="r" values="22;29;22" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="430" y="105" fill="#ede9fe" font-size="28" font-weight="700">Verify</text>
    <circle cx="690" cy="155" r="22" fill="#fbbf24" filter="url(#glow)"><animate attributeName="r" values="22;29;22" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
    <text x="690" y="105" fill="#fef3c7" font-size="28" font-weight="700">Connect</text>
    <circle cx="950" cy="155" r="22" fill="#4ade80" filter="url(#glow)"><animate attributeName="r" values="22;29;22" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
    <text x="950" y="105" fill="#dcfce7" font-size="28" font-weight="700">Act</text>
    <circle cx="170" cy="155" r="9" fill="#ffffff"><animate attributeName="cx" values="170;430;690;950;170" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite"/></circle>
    <text x="600" y="235" fill="#cbd5e1" font-size="24">Your next chapter starts with one informed step.</text>
  </g>
</svg>
